<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>二手手机成本核算工具</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#f5f5f5; --card:#fff; --border:#e0e0e0;
  --text1:#1a1a1a; --text2:#666; --text3:#999;
  --accent:#1677ff; --orange:#fa8c16; --green:#52c41a; --red:#ff4d4f;
  --bg1:#fafafa; --bg2:#f0f0f0;
  --radius:10px;
}
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text1); line-height:1.5; -webkit-font-smoothing:antialiased; }
.container { max-width:600px; margin:0 auto; padding:12px; }
.header { display:flex; align-items:center; justify-content:space-between; padding:10px 2px 14px; }
.header h1 { font-size:20px; color:var(--text1); letter-spacing:.5px; }
.header .sub { font-size:12px; color:var(--text3); margin-top:2px; }
.btn-sync { display:inline-flex; align-items:center; gap:5px; height:34px; padding:0 14px; border:none; border-radius:17px; background:var(--accent); color:#fff; font-size:13px; font-weight:500; cursor:pointer; box-shadow:0 2px 6px rgba(22,119,255,.35); white-space:nowrap; }
.btn-sync:active { opacity:.8; }
.btn-sync:disabled { opacity:.6; cursor:default; }
.card { background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.card-title { font-size:14px; font-weight:600; margin-bottom:10px; color:var(--accent); border-bottom:1px solid var(--border); padding-bottom:6px; display:flex; align-items:center; justify-content:space-between; }
.form-group { margin-bottom:10px; }
.form-row { display:flex; gap:8px; }
.form-row > * { flex:1; }
label { font-size:12px; color:var(--text2); display:block; margin-bottom:3px; }
input, select { width:100%; height:38px; border:1px solid var(--border); border-radius:8px; padding:0 10px; font-size:14px; background:var(--card); color:var(--text1); outline:none; transition:border-color .2s; }
input:focus, select:focus { border-color:var(--accent); }
input:disabled { background:var(--bg2); color:var(--text3); }
input[type=number] { -moz-appearance:textfield; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
.hint { font-size:11px; color:var(--text3); }
.btn { display:inline-flex; align-items:center; justify-content:center; height:36px; padding:0 14px; border:none; border-radius:8px; font-size:13px; cursor:pointer; background:var(--accent); color:#fff; transition:opacity .2s; }
.btn:active { opacity:.8; }
.btn-sm { height:30px; font-size:12px; padding:0 8px; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text2); }
.btn-danger { color:var(--red); background:transparent; border:1px solid var(--border); }
.dmg-part-row { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
.dmg-part-row select { width:160px; height:34px; font-size:13px; }
.dmg-part-row input { width:70px; height:34px; font-size:13px; }
.dmg-brand-tag, .dmg-model-tag { font-size:11px; color:var(--text2); background:var(--bg2); padding:3px 6px; border-radius:4px; white-space:nowrap; }
.result-table { width:100%; font-size:13px; }
.result-table td { padding:3px 4px; }
.result-table .label-cell { color:var(--text2); padding-left:8px; }
.result-table .val-cell { text-align:right; font-weight:500; }
.result-table .section-hdr { font-weight:600; color:var(--accent); border-bottom:1px solid var(--border); padding:8px 0 4px; }
.result-table .subtotal-row { border-top:1px solid var(--border); font-weight:600; padding-top:4px; }
.result-table .total-row { border-top:2px solid var(--border); padding-top:8px; }
.profit-positive { color:var(--green); }
.profit-negative { color:var(--red); }
.rec-box { margin-top:10px; padding:8px 12px; background:var(--bg1); border-radius:6px; font-size:13px; text-align:center; }
.preset-badge { display:inline-block; background:var(--bg2); color:var(--text2); font-size:10px; padding:1px 5px; border-radius:3px; margin-left:4px; }
@media(max-width:380px) {
  .dmg-part-row select { width:140px; }
  .dmg-part-row input { width:60px; }
}
.data-mgmt { font-size:12px; }
.data-mgmt button { margin-right:6px; margin-bottom:4px; }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; }
#toast.show { opacity:1; }
.tab-bar { display:flex; gap:4px; margin-bottom:12px; background:var(--card); border-radius:var(--radius); padding:3px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.tab-btn { flex:1; text-align:center; padding:8px; font-size:13px; border:none; background:transparent; border-radius:8px; color:var(--text2); cursor:pointer; transition:all .2s; }
.tab-btn.active { background:var(--accent); color:#fff; font-weight:500; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.parts-table { width:100%; font-size:12px; border-collapse:collapse; }
.parts-table th { background:var(--bg2); padding:6px 4px; text-align:left; font-weight:500; }
.parts-table td { padding:4px; border-bottom:1px solid var(--border); }
.parts-table input, .parts-table select { height:30px; font-size:12px; border-radius:4px; }
.action-row { display:flex; gap:6px; margin-top:8px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>成本核算</h1>
      <div class="sub">二手手机采购 · 利润测算</div>
    </div>
    <button class="btn-sync" id="sync-tdoc-btn" onclick="syncFromTencent()">⟳ 同步数据</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('calc')">成本核算</button>
    <button class="tab-btn" onclick="switchTab('parts')">配件价格</button>
    <button class="tab-btn" onclick="switchTab('selling')">销售价表</button>
  </div>

  <!-- ===== Tab: 成本核算 ===== -->
  <div id="tab-calc" class="tab-content active">

  <!-- 基本信息 -->
  <div class="card">
    <div class="card-title">基本信息</div>
    <div class="form-row">
      <div class="form-group">
        <label>采购价 <span class="hint">(闲鱼买入价)</span></label>
        <input type="number" id="cc-purchase-price" placeholder="如 3500" oninput="calc()">
      </div>
      <div class="form-group">
        <label>靓机汇参考价 <span class="hint">(可留空)</span></label>
        <input type="number" id="cc-ljhh-price" placeholder="如 3600" oninput="onLjhhPriceInput()">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>品牌</label>
        <select id="cc-brand" onchange="onBrandChange()"></select>
      </div>
      <div class="form-group">
        <label>型号</label>
        <select id="cc-model" onchange="onModelChange()"></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>内存</label>
        <select id="cc-ram" onchange="lookupAndCalc()"></select>
      </div>
      <div class="form-group">
        <label>存储</label>
        <select id="cc-storage" onchange="lookupAndCalc()"></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>成色</label>
        <select id="cc-condition" onchange="onConditionChange()">
          <option value="brand_new">充新</option>
          <option value="excellent">靓机（99新）</option>
          <option value="good" selected>小花（95新）</option>
          <option value="fair">大花（9新）</option>
          <option value="broken">内爆</option>
        </select>
      </div>
      <div class="form-group">
        <label>来源</label>
        <select id="cc-source" onchange="onSourceChange()">
          <option value="default" selected>国行(默认)</option>
          <option value="refurb">国行翻新</option>
          <option value="other">其他地区版本</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 价格信息 -->
  <div class="card">
    <div class="card-title">价格信息</div>
    <div class="form-row">
      <div class="form-group">
        <label>销售价 <span class="hint">(自动填充/可改)</span></label>
        <input type="number" id="cc-selling-price" placeholder="自动填充" oninput="onSellingInput()">
      </div>
      <div class="form-group">
        <label>结算价 <span class="hint">(自动填充/可改)</span></label>
        <input type="number" id="cc-settlement-price" placeholder="自动填充" oninput="onSettlementInput()">
      </div>
    </div>
    <div class="form-group">
      <label>手工费 <span class="hint">(默认0，可手动修改)</span></label>
      <input type="number" id="cc-labor-fee" value="0" oninput="calc()">
    </div>
  </div>

  <!-- 损坏配件 -->
  <div class="card">
    <div class="card-title">
      损坏配件
      <button class="btn btn-sm" onclick="addDmgRow()">+ 添加</button>
    </div>
    <div id="cc-damaged-parts"></div>
  </div>

  <!-- 计算结果 -->
  <div class="card">
    <div class="card-title">核算结果</div>
    <div id="cc-result"><p class="hint">请输入采购价开始计算</p></div>
  </div>

  </div>

  <!-- ===== Tab: 配件价格管理 ===== -->
  <div id="tab-parts" class="tab-content">
    <div class="card">
      <div class="card-title">
        配件价格表
        <button class="btn btn-sm" onclick="addPartsRow()">+ 添加</button>
      </div>
      <p class="hint" style="margin-bottom:8px">配件数据保存在本地浏览器，可导出备份</p>
      <div style="overflow-x:auto">
      <table class="parts-table" id="parts-table">
        <thead><tr><th>品牌</th><th>型号</th><th>类别</th><th>备注</th><th>价格</th><th></th></tr></thead>
        <tbody id="parts-tbody"></tbody>
      </table>
      </div>
    </div>
  </div>

  <!-- ===== Tab: 销售价管理 ===== -->
  <div id="tab-selling" class="tab-content">
    <div class="card">
      <div class="card-title">
        销售价表
        <button class="btn btn-sm" onclick="addSellingRow()">+ 添加</button>
      </div>
      <p class="hint" style="margin-bottom:8px">销售价数据保存在本地浏览器，可导出备份</p>
      <div style="overflow-x:auto">
      <table class="parts-table" id="selling-table">
        <thead><tr><th>品牌</th><th>型号</th><th>存储</th><th>成色</th><th>销售价</th><th>结算价</th><th></th></tr></thead>
        <tbody id="selling-tbody"></tbody>
      </table>
      </div>
    </div>
  </div>

  <!-- 数据管理 -->
  <div class="card">
    <div class="card-title">数据管理</div>
    <div class="data-mgmt">
      <button class="btn btn-outline btn-sm" onclick="exportData()">导出数据</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-file').click()">导入数据</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-outline btn-sm" onclick="resetData()">恢复默认</button>
    </div>
  </div>

</div>
<div id="toast"></div>

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      data.modelLibrary = parsed.modelLibrary || {};
      data.parts = parsed.parts || [];
      data.selling = parsed.selling || [];
      data.ljhh = parsed.ljhh || [];

      // 数据版本不一致 → 有新的官方数据（靓机汇报价每天更新两次），
      // 用内嵌的新数据覆盖官方来源，同时保留用户自己手工添加/改过的条目。
      if (parsed.dataVersion !== DATA_VERSION) {
        const isOfficial = x => typeof x.id === 'string'
          && (x.id.startsWith('fs_') || x.id.startsWith('lj_') || x.id.startsWith('tc_'));
        const myParts = (data.parts || []).filter(x => !isOfficial(x));
        const mySelling = (data.selling || []).filter(x => !isOfficial(x));
        const myLjhh = (data.ljhh || []).filter(x => !isOfficial(x));
        data.parts = JSON.parse(JSON.stringify(DEFAULT_PARTS)).concat(myParts);
        data.selling = JSON.parse(JSON.stringify(DEFAULT_SELLING)).concat(mySelling);
        data.ljhh = JSON.parse(JSON.stringify(DEFAULT_LJHH)).concat(myLjhh);
        // 型号库：并集（用户可能自己加过机型）
        const lib = JSON.parse(JSON.stringify(DEFAULT_MODEL_LIBRARY));
        Object.keys(data.modelLibrary || {}).forEach(b => {
          const cur = lib[b] || (lib[b] = []);
          const low = new Set(cur.map(x => String(x).toLowerCase()));
          (data.modelLibrary[b] || []).forEach(m => {
            if (!low.has(String(m).toLowerCase())) { cur.push(m); low.add(String(m).toLowerCase()); }
          });
          lib[b] = cur.sort((a, c) => String(a).length - String(c).length || String(a).localeCompare(String(c)));
        });
        data.modelLibrary = lib;
        saveData();
        console.log('数据已更新到版本', DATA_VERSION,
                    '（保留了', myParts.length + mySelling.length + myLjhh.length, '条自定义条目）');
      }
      return;
    }
  } catch(e) { console.error('load failed', e); }
  // First run: init defaults
  data.modelLibrary = JSON.parse(JSON.stringify(DEFAULT_MODEL_LIBRARY));
  data.parts = JSON.parse(JSON.stringify(DEFAULT_PARTS));
  data.selling = JSON.parse(JSON.stringify(DEFAULT_SELLING));
  data.ljhh = JSON.parse(JSON.stringify(DEFAULT_LJHH));
  saveData();
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(
      Object.assign({}, data, {dataVersion: DATA_VERSION})));
  } catch(e) { console.error('save failed', e); }
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toNumber(v) {
  if (typeof v === 'number') return v;
  if (!v) return 0;
  return Number(String(v).replace(/[,，\s]/g,'')) || 0;
}

// ======================== Fee / Settlement Logic ========================
function isAppleBrand(brand) {
  const b = (brand||'').toLowerCase().trim();
  return b === 'apple' || b === '苹果' || b === 'iphone';
}

function normalizeSource(src) {
  if (!src) return 'default';
  const s = String(src).toLowerCase().trim();
  if (s === 'refurb' || s.includes('翻新') || s.includes('官翻')) return 'refurb';
  if (s === 'other' || s.includes('其他') || s.includes('地区')) return 'other';
  return 'default';
}

function calcSettlement(sellingPrice, brand, source) {
  if (!sellingPrice || sellingPrice <= 0)
    return { settlementPrice:0, serviceFee:0, tax:0, rate:0, ratePercent:'0%', capped:false, capValue:null };

  const brandKey = isAppleBrand(brand) ? 'apple' : 'other';
  const sourceKey = source === 'refurb' ? 'refurb' : 'default';
  const tiers = FEE_TABLE[brandKey][sourceKey];

  let tier = tiers[0];
  for (const t of tiers) {
    if (sellingPrice >= t.min && sellingPrice < t.max) { tier = t; break; }
  }

  const rate = tier.rate;
  let serviceFee = sellingPrice * rate;
  let capped = false;
  if (serviceFee > tier.cap) { serviceFee = tier.cap; capped = true; }

  const tax = sellingPrice * TAX_RATE;
  const settlementPrice = sellingPrice - serviceFee - tax;

  return {
    settlementPrice: Math.round(settlementPrice * 100) / 100,
    serviceFee: Math.round(serviceFee * 100) / 100,
    tax: Math.round(tax * 100) / 100,
    rate, ratePercent: (rate*100).toFixed(2)+'%',
    capped, capValue: tier.cap === Infinity ? null : tier.cap,
  };
}

// ======================== Selling Price Lookup ========================
function lookupSellingPrice(brand, model, ram, storage, conditionGrade, source) {
  if (!brand || !model) return null;
  const all = data.selling;
  if (!all || all.length === 0) return null;

  const brandMatch = s => (s.brand||'').toLowerCase() === brand.toLowerCase();
  const modelMatch = s => (s.model||'').toLowerCase() === model.toLowerCase();
  const sourceMatch = s => !source || normalizeSource(s.source) === normalizeSource(source);

  // 1. Exact
  let match = all.find(s =>
    brandMatch(s) && modelMatch(s) && sourceMatch(s) &&
    (!ram || s.ram === ram) &&
    (!storage || s.storage === storage) &&
    (!conditionGrade || s.conditionGrade === conditionGrade)
  );
  // 2. Without ram
  if (!match && ram) {
    match = all.find(s =>
      brandMatch(s) && modelMatch(s) && sourceMatch(s) &&
      (!storage || s.storage === storage) &&
      (!conditionGrade || s.conditionGrade === conditionGrade)
    );
  }
  // 3. Without ram+storage
  if (!match && (ram || storage)) {
    match = all.find(s =>
      brandMatch(s) && modelMatch(s) && sourceMatch(s) &&
      (!conditionGrade || s.conditionGrade === conditionGrade)
    );
  }
  // 4. Without condition
  if (!match && conditionGrade) {
    match = all.find(s =>
      brandMatch(s) && modelMatch(s) && sourceMatch(s) &&
      (!ram || s.ram === ram) && (!storage || s.storage === storage)
    );
  }
  // 5. Without source
  if (!match && source) {
    match = all.find(s =>
      brandMatch(s) && modelMatch(s) &&
      (!ram || s.ram === ram) && (!storage || s.storage === storage) &&
      (!conditionGrade || s.conditionGrade === conditionGrade)
    );
    if (!match && ram) {
      match = all.find(s =>
        brandMatch(s) && modelMatch(s) &&
        (!storage || s.storage === storage) &&
        (!conditionGrade || s.conditionGrade === conditionGrade)
      );
    }
  }
  return match || null;
}

// ======================== Lianjihui Reference Price Lookup ========================
function lookupLjhhPrice(brand, model, ram, storage, conditionGrade) {
  if (!brand || !model || !data.ljhh || data.ljhh.length === 0) return null;

  const brandMatch = s => (s.brand || '').toLowerCase() === brand.toLowerCase();
  const modelMatch = s => (s.model || '').toLowerCase() === model.toLowerCase();

  const matches = data.ljhh.filter(s =>
    brandMatch(s) && modelMatch(s) &&
    (!ram || s.ram === ram) &&
    (!storage || s.storage === storage) &&
    (!conditionGrade || s.conditionGrade === conditionGrade)
  );

  if (matches.length === 0) return null;

  matches.sort((a, b) => {
    const da = a.date ? new Date(a.date).getTime() : 0;
    const db = b.date ? new Date(b.date).getTime() : 0;
    return db - da;
  });

  return matches[0];
}

// ======================== Parts Lookup ========================
function getPartsByModel(brand, model) {
  const b = (brand||'').toLowerCase();
  const m = (model||'').toLowerCase();
  return data.parts.filter(p =>
    (!b || (p.brand||'').toLowerCase() === b) &&
    (!m || (p.model||'').toLowerCase() === m)
  );
}

function getPartsByBrand(brand) {
  const b = (brand||'').toLowerCase();
  return data.parts.filter(p => (p.brand||'').toLowerCase() === b);
}

function findDefaultPrice(brand, model, partType) {
  if (!partType) return null;
  const b = (brand||'').toLowerCase();
  const m = (model||'').toLowerCase();
  const pt = partType.toLowerCase();

  const modelParts = getPartsByModel(brand, model);
  const brandParts = getPartsByBrand(brand);

  const findIn = (list) => {
    let match = list.find(p =>
      (p.brand||'').toLowerCase() === b &&
      (p.model||'').toLowerCase() === m &&
      (p.partType||'').toLowerCase() === pt
    );
    if (match) return match.price;
    if (b) {
      match = list.find(p =>
        (p.brand||'').toLowerCase() === b &&
        (p.partType||'').toLowerCase() === pt
      );
      if (match) return match.price;
    }
    match = list.find(p => (p.partType||'').toLowerCase() === pt);
    if (match) return match.price;
    return null;
  };

  return findIn(modelParts) ?? findIn(brandParts);
}

  clearPriceFields();

}

function onSourceChange() {
  // 来源影响费率（国行翻新统一 3.6%），若销售价是手填的要保留并重算结算价
  const manualSelling = sellingPriceEdited
    ? document.getElementById('cc-selling-price').value : '';
  sellingPriceEdited = false;
  settlementPriceEdited = false;
  clearPriceFields();
  if (manualSelling) {
    document.getElementById('cc-selling-price').value = manualSelling;
    sellingPriceEdited = true;
    autoFillSettlement();
  }
  lookupAndCalc();
}

function onSellingInput() {
  sellingPriceEdited = true;
  // 手填销售价时自动按阶梯费率反算结算价。
  // 原实现只是把结算价清空，导致「飞书没有该机型销售价 → 手填 → 结算价永远为空」，
  // 而下面的利润计算依赖结算价，等于整条链断掉。
  if (!settlementPriceEdited) {
    autoFillSettlement();
  }
  calc();
}

function autoFillSettlement() {
  const el = document.getElementById('cc-settlement-price');
  const sp = parseFloat(document.getElementById('cc-selling-price').value) || 0;
  if (sp <= 0) { el.value = ''; return; }
  const brand = document.getElementById('cc-brand').value;
  const source = document.getElementById('cc-source').value;
  const r = calcSettlement(sp, brand, source);
  el.value = r.settlementPrice > 0 ? r.settlementPrice : '';
}

function onSettlementInput() {
  settlementPriceEdited = true;
  calc();
}

function onLjhhPriceInput() {
  ljhhPriceEdited = true;
  calc();
}

function clearPriceFields() {
  if (!sellingPriceEdited) document.getElementById('cc-selling-price').value = '';
  if (!settlementPriceEdited) document.getElementById('cc-settlement-price').value = '';
}

function loadKbParts() {
  const brand = document.getElementById('cc-brand').value;
  const model = document.getElementById('cc-model').value;
  if (!brand || !model) { kbPartsCache = []; kbBrandPartsCache = []; return; }
  kbPartsCache = getPartsByModel(brand, model);
  kbBrandPartsCache = getPartsByBrand(brand);
}

let ljhhPriceEdited = false;

function lookupAndCalc() {
  const brand = document.getElementById('cc-brand').value;
  const model = document.getElementById('cc-model').value;
  const ram = document.getElementById('cc-ram')?.value || '';
  const storage = document.getElementById('cc-storage')?.value || '';
  const condition = document.getElementById('cc-condition')?.value || '';
  const source = document.getElementById('cc-source')?.value || 'default';

  if (!brand || !model) { calc(); return; }

  const entry = lookupSellingPrice(brand, model, ram, storage, condition, source);
  if (entry) {
    if (!sellingPriceEdited && entry.price > 0)
      document.getElementById('cc-selling-price').value = entry.price;
    if (!settlementPriceEdited && entry.settlementPrice > 0)
      document.getElementById('cc-settlement-price').value = entry.settlementPrice;
  }

  // Auto-fill Lianjihui reference price (unless user manually edited it)
  if (!ljhhPriceEdited) {
    const ljhh = lookupLjhhPrice(brand, model, ram, storage, condition);
    if (ljhh && ljhh.price > 0) {
      document.getElementById('cc-ljhh-price').value = ljhh.price;
    }
  }

  calc();
}

// ======================== UI: Damaged Parts ========================
function refreshDmgSelects() {
  document.querySelectorAll('#cc-damaged-parts > div').forEach(div => {
    const brandSpan = div.querySelector('.dmg-brand-tag');
    const modelSpan = div.querySelector('.dmg-model-tag');
    const brand = document.getElementById('cc-brand')?.value || '';
    const model = document.getElementById('cc-model')?.value || '';
    if (brandSpan) brandSpan.textContent = brand || '--';
    if (modelSpan) modelSpan.textContent = model || '--';
    const select = div.querySelector('select');
    if (!select) return;
    const currentVal = select.value;
    populateDmgSelect(select);
    if (currentVal) {
      select.value = currentVal;
      onDmgSelectChange(select);
    }
  });
}

function populateDmgSelect(select) {
  const brand = document.getElementById('cc-brand')?.value || '';
  const model = document.getElementById('cc-model')?.value || '';

  let opts = '<option value="">-- 选择配件 --</option>';
  // KB matched parts
  const catMap = new Map();
  for (const p of kbPartsCache) {
    const cat = p.partType || p.remark || '其他';
    if (!catMap.has(cat)) catMap.set(cat, []);
    catMap.get(cat).push(p);
  }
  const sortedCats = [...catMap.keys()].sort((a,b) => a.localeCompare(b,'zh'));
  for (const cat of sortedCats) {
    const parts = catMap.get(cat);
    if (parts.length === 1) {
      const p = parts[0];
      const display = `${escapeHtml(cat)} - ${p.price}元${p.remark ? ' (' + escapeHtml(p.remark) + ')' : ''}`;
      opts += `<option value="kb_${escapeHtml(p.id||'')}" data-price="${p.price}" data-name="${escapeHtml(cat)}" data-type="${escapeHtml(p.partType||cat)}" data-remark="${escapeHtml(p.remark||'')}">${display}</option>`;
    } else {
      opts += `<optgroup label="${escapeHtml(cat)}">`;
      for (const p of parts) {
        const subLabel = p.remark ? escapeHtml(p.remark) : `${p.price}元`;
        opts += `<option value="kb_${escapeHtml(p.id||'')}" data-price="${p.price}" data-name="${escapeHtml(cat)}" data-type="${escapeHtml(p.partType||cat)}" data-remark="${escapeHtml(p.remark||'')}">${subLabel} - ${p.price}元</option>`;
      }
      opts += '</optgroup>';
    }
  }
  // Predefined categories
  const existing = new Set([...catMap.keys()]);
  for (const pt of PART_TYPE_CATEGORIES) {
    if (existing.has(pt)) continue;
    const defPrice = findDefaultPrice(brand, model, pt);
    const priceText = defPrice ? `默认${defPrice}元(可改)` : '手动输入';
    opts += `<option value="predef_${escapeHtml(pt)}" data-price="${defPrice||''}" data-name="${escapeHtml(pt)}" data-type="${escapeHtml(pt)}" data-remark="">${escapeHtml(pt)} - ${priceText}</option>`;
  }
  opts += '<option value="manual">手动输入</option>';
  select.innerHTML = opts;
}

function addDmgRow() {
  const brand = document.getElementById('cc-brand')?.value || '';
  const model = document.getElementById('cc-model')?.value || '';
  const container = document.getElementById('cc-damaged-parts');
  const div = document.createElement('div');
  div.className = 'dmg-part-row';
  div.innerHTML = `
    <span class="dmg-brand-tag">${escapeHtml(brand) || '--'}</span>
    <span class="dmg-model-tag">${escapeHtml(model) || '--'}</span>
    <select onchange="onDmgSelectChange(this)"><option value="">-- 选择配件 --</option></select>
    <input type="number" placeholder="价格" disabled oninput="calc()">
    <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove();calc()">删</button>
  `;
  container.appendChild(div);
  populateDmgSelect(div.querySelector('select'));
}

function onDmgSelectChange(sel) {
  const div = sel.parentElement;
  const priceInput = div.querySelector('input[type=number]');

  if (sel.value === 'manual') {
    priceInput.disabled = false;
    priceInput.placeholder = '输入价格';
    priceInput.value = '';
    priceInput.focus();
  } else if (sel.value.startsWith('predef_')) {
    const opt = sel.options[sel.selectedIndex];
    priceInput.disabled = false;
    priceInput.placeholder = '输入价格';
    priceInput.value = opt.dataset.price || '';
    priceInput.focus();
  } else if (sel.value.startsWith('kb_')) {
    const opt = sel.options[sel.selectedIndex];
    priceInput.value = opt.dataset.price || '';
    priceInput.disabled = false;
  } else {
    priceInput.value = '';
    priceInput.disabled = true;
  }
  calc();
}

// ======================== Main Calc ========================
function calc() {
  const purchasePrice = toNumber(document.getElementById('cc-purchase-price').value);
  const ljhhPrice = toNumber(document.getElementById('cc-ljhh-price').value);
  const brand = document.getElementById('cc-brand').value;
  const model = document.getElementById('cc-model').value;
  const ram = document.getElementById('cc-ram')?.value || '';
  const storage = document.getElementById('cc-storage')?.value || '';
  const conditionGrade = document.getElementById('cc-condition')?.value || 'good';
  const source = document.getElementById('cc-source')?.value || 'default';
  const laborFee = toNumber(document.getElementById('cc-labor-fee').value);
  const manualSelling = document.getElementById('cc-selling-price').value;
  const manualSettlement = document.getElementById('cc-settlement-price').value;

  // Collect damaged parts
  const damagedParts = [];
  document.querySelectorAll('#cc-damaged-parts > div').forEach(div => {
    const sel = div.querySelector('select');
    const priceInput = div.querySelector('input[type=number]');
    if (!sel || !sel.value) return;

    if (sel.value === 'manual') {
      const price = toNumber(priceInput?.value);
      if (price > 0) damagedParts.push({partType:'', partName:'手动配件', price});
    } else if (sel.value.startsWith('predef_')) {
      const partType = sel.value.replace('predef_', '');
      const price = toNumber(priceInput?.value);
      if (price > 0) damagedParts.push({partType, partName:partType, price});
    } else if (sel.value.startsWith('kb_')) {
      const opt = sel.options[sel.selectedIndex];
      const price = toNumber(priceInput?.value || opt.dataset.price);
      if (price > 0) {
        const partName = opt.dataset.remark ? `${opt.dataset.name}(${opt.dataset.remark})` : opt.dataset.name;
        damagedParts.push({partType: opt.dataset.type || '', partName, price});
      }
    }
  });

  // Parts cost
  let partsCost = 0;
  const partsBreakdown = damagedParts.map(p => {
    partsCost += p.price;
    return p;
  });
  partsCost = Math.round(partsCost * 100) / 100;

  // Total cost
  const totalCost = Math.round((purchasePrice + partsCost + laborFee) * 100) / 100;

  // Selling price
  let sellingPrice = 0, sellingSource = 'none';
  if (manualSelling && toNumber(manualSelling) > 0) {
    sellingPrice = toNumber(manualSelling);
    sellingSource = 'manual';
  } else {
    const entry = lookupSellingPrice(brand, model, ram, storage, conditionGrade, source);
    if (entry && entry.price > 0) {
      sellingPrice = entry.price;
      sellingSource = 'knowledge_base';
    }
  }

  // Settlement price
  const settlement = calcSettlement(sellingPrice, brand, source);
  let finalSettlement = 0, settleSource = 'calculated';
  if (manualSettlement && toNumber(manualSettlement) > 0) {
    finalSettlement = Math.round(toNumber(manualSettlement) * 100) / 100;
    settleSource = 'manual';
  } else {
    const entry = (!manualSelling || toNumber(manualSelling) === 0)
      ? lookupSellingPrice(brand, model, ram, storage, conditionGrade, source) : null;
    if (entry && entry.settlementPrice > 0) {
      finalSettlement = entry.settlementPrice;
      settleSource = 'knowledge_base';
    } else {
      finalSettlement = settlement.settlementPrice;
      settleSource = 'calculated';
    }
  }

  // Profit
  const profit = Math.round((finalSettlement - totalCost) * 100) / 100;
  const profitRate = finalSettlement > 0 ? Math.round((profit / finalSettlement) * 1000) / 10 : 0;

  // Recommendation
  let rec = 'hold', recReason = '';
  if (profit > 0 && profitRate >= 15) { rec = 'buy'; recReason = `利润率${profitRate}%，利润空间充足`; }
  else if (profit > 0 && profitRate >= 5) { rec = 'consider'; recReason = `利润率${profitRate}%，利润一般，可考虑砍价`; }
  else if (profit > 0) { rec = 'negotiate'; recReason = `利润率仅${profitRate}%，需要大幅砍价`; }
  else { rec = 'skip'; recReason = `亏损${Math.abs(profit)}元，不建议采购`; }

  // Render
  if (!purchasePrice) {
    document.getElementById('cc-result').innerHTML = '<p class="hint">请输入采购价开始计算</p>';
    return;
  }

  const pColor = profit > 0 ? 'var(--green)' : 'var(--red)';
  const recIcon = {buy:'✅ 建议采购', consider:'🤔 可考虑', negotiate:'💬 需砍价', skip:'❌ 不建议', hold:'⏸ 观望'}[rec];
  const capNote = settlement.capped ? ` <span style="color:#fa8c16">(已封顶${settlement.capValue}元)</span>` : '';
  const sellLabel = sellingSource === 'knowledge_base' ? '(数据表)' : sellingSource === 'manual' ? '(手动)' : '(未匹配)';
  const settleLabel = settleSource === 'knowledge_base' ? '(数据表)' : settleSource === 'manual' ? '(手动)' : '(公式计算)';

  let partsHtml = '';
  if (partsBreakdown.length > 0) {
    partsHtml = partsBreakdown.map(p => `
      <tr><td class="label-cell" style="padding-left:16px">${escapeHtml(p.partName)}</td><td class="val-cell">${p.price}元</td></tr>
    `).join('');
  }

  document.getElementById('cc-result').innerHTML = `
    <table class="result-table">
      <tr><td colspan="2" class="section-hdr">📊 总成本</td></tr>
      <tr><td class="label-cell">采购价</td><td class="val-cell">${purchasePrice}元</td></tr>
      ${ljhhPrice > 0 ? `<tr><td class="label-cell">靓机汇参考价</td><td class="val-cell">${ljhhPrice}元</td></tr>` : ''}
      ${ljhhPrice > 0 ? `<tr><td class="label-cell">与参考价差</td><td class="val-cell" style="color:${purchasePrice > ljhhPrice ? 'var(--red)' : 'var(--green)'}">${purchasePrice > ljhhPrice ? '+' : ''}${Math.round((purchasePrice - ljhhPrice) * 100) / 100}元</td></tr>` : ''}
      ${brand||model ? `<tr><td class="label-cell">机型</td><td class="val-cell" style="font-size:12px">${escapeHtml(brand)} ${escapeHtml(model)}${ram?' / '+escapeHtml(ram):''}${storage?' / '+escapeHtml(storage):''}</td></tr>` : ''}
      ${partsHtml}
      ${partsBreakdown.length > 0 ? `<tr><td class="label-cell">配件费小计</td><td class="val-cell">${partsCost}元</td></tr>` : '<tr><td class="label-cell">配件费</td><td class="val-cell">0元</td></tr>'}
      <tr><td class="label-cell">人工费</td><td class="val-cell">${laborFee}元</td></tr>
      <tr class="subtotal-row"><td>总成本</td><td class="val-cell" style="color:var(--orange)">${totalCost}元</td></tr>

      <tr><td colspan="2" class="section-hdr" style="margin-top:8px">💰 结算价</td></tr>
      <tr><td class="label-cell">销售价${sellLabel}</td><td class="val-cell">${sellingPrice || 0}元</td></tr>
      <tr><td class="label-cell">服务费率</td><td class="val-cell">${settlement.ratePercent || '-'}${capNote}</td></tr>
      <tr><td class="label-cell">销售服务费</td><td class="val-cell" style="color:var(--red)">-${settlement.serviceFee || 0}元</td></tr>
      <tr><td class="label-cell">电商税(1%)</td><td class="val-cell" style="color:var(--red)">-${settlement.tax || 0}元</td></tr>
      <tr class="subtotal-row"><td>结算价${settleLabel}</td><td class="val-cell" style="color:#1677ff">${finalSettlement || 0}元</td></tr>

      <tr class="total-row"><td style="font-weight:600;font-size:15px;color:${pColor}">利润</td><td class="val-cell" style="font-weight:600;font-size:15px;color:${pColor}">${profit > 0 ? '+' : ''}${profit}元</td></tr>
      <tr><td class="label-cell">利润率</td><td class="val-cell" style="color:${pColor}">(${profitRate}%)</td></tr>
    </table>
    <div class="rec-box">${recIcon} ${escapeHtml(recReason)}</div>
  `;
}

// ======================== Tab: Parts Table ========================
function renderPartsTable() {
  const tbody = document.getElementById('parts-tbody');
  tbody.innerHTML = '';
  for (const p of data.parts) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(p.brand)}" onchange="updatePart('${p.id}','brand',this.value)"></td>
      <td><input type="text" value="${escapeHtml(p.model)}" onchange="updatePart('${p.id}','model',this.value)"></td>
      <td><select onchange="updatePart('${p.id}','partType',this.value)">${PART_TYPE_CATEGORIES.map(c=>`<option value="${c}" ${p.partType===c?'selected':''}>${c}</option>`).join('')}</select></td>
      <td><input type="text" value="${escapeHtml(p.remark||'')}" onchange="updatePart('${p.id}','remark',this.value)" style="width:80px"></td>
      <td><input type="number" value="${p.price}" onchange="updatePart('${p.id}','price',this.value)" style="width:60px"></td>
      <td><button class="btn btn-sm btn-danger" onclick="deletePart('${p.id}')">删</button></td>
    `;
    tbody.appendChild(tr);
  }
}

function addPartsRow() {
  const item = { id:genId('part'), brand:'', model:'', partType:'屏幕', remark:'', price:0 };
  data.parts.push(item);
  saveData();
  renderPartsTable();
}

function updatePart(id, field, value) {
  const p = data.parts.find(x => x.id === id);
  if (!p) return;
  if (field === 'price') p[field] = toNumber(value);
  else p[field] = value;
  saveData();
}

function deletePart(id) {
  data.parts = data.parts.filter(x => x.id !== id);
  saveData();
  renderPartsTable();
}

// ======================== Tab: Selling Table ========================
function renderSellingTable() {
  const tbody = document.getElementById('selling-tbody');
  tbody.innerHTML = '';
  for (const s of data.selling) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(s.brand)}" onchange="updateSelling('${s.id}','brand',this.value)" style="width:60px"></td>
      <td><input type="text" value="${escapeHtml(s.model)}" onchange="updateSelling('${s.id}','model',this.value)" style="width:80px"></td>
      <td><input type="text" value="${escapeHtml(s.storage||'')}" onchange="updateSelling('${s.id}','storage',this.value)" style="width:55px"></td>
      <td>
        <select onchange="updateSelling('${s.id}','conditionGrade',this.value)">
          <option value="brand_new" ${s.conditionGrade==='brand_new'?'selected':''}>充新</option>
<option value="excellent" ${s.conditionGrade==='excellent'?'selected':''}>靓机（99新）</option>
<option value="good" ${s.conditionGrade==='good'?'selected':''}>小花（95新）</option>
<option value="fair" ${s.conditionGrade==='fair'?'selected':''}>大花（9新）</option>
<option value="broken" ${s.conditionGrade==='broken'?'selected':''}>内爆</option>
          <option value="fair" ${s.conditionGrade==='fair'?'selected':''}>90新</option>
        </select>
      </td>
      <td><input type="number" value="${s.price}" onchange="updateSelling('${s.id}','price',this.value)" style="width:55px"></td>
      <td><input type="number" value="${s.settlementPrice||''}" onchange="updateSelling('${s.id}','settlementPrice',this.value)" style="width:55px"></td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteSelling('${s.id}')">删</button></td>
    `;
    tbody.appendChild(tr);
  }
}

function addSellingRow() {
  const item = { id:genId('sell'), brand:'', model:'', ram:'', storage:'', conditionGrade:'good', price:0, settlementPrice:0, source:'default' };
  data.selling.push(item);
  saveData();
  renderSellingTable();
}

function updateSelling(id, field, value) {
  const s = data.selling.find(x => x.id === id);
  if (!s) return;
  if (field === 'price' || field === 'settlementPrice') s[field] = toNumber(value);
  else s[field] = value;
  saveData();
}

function deleteSelling(id) {
  data.selling = data.selling.filter(x => x.id !== id);
  saveData();
  renderSellingTable();
}

// ======================== Tab Switch ========================
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  [...document.querySelectorAll('.tab-btn')].forEach(b => {
    if (b.getAttribute('onclick') && b.getAttribute('onclick').includes(name))
      b.classList.add('active');
  });
}

// ======================== Data Import/Export ========================
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cost_calc_data_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('数据已导出');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed.modelLibrary) data.modelLibrary = parsed.modelLibrary;
      if (parsed.parts) data.parts = parsed.parts;
      if (parsed.selling) data.selling = parsed.selling;
      if (parsed.ljhh) data.ljhh = parsed.ljhh;
      saveData();
      populateBrand();
      renderPartsTable();
      renderSellingTable();
      onBrandChange();
      toast('数据导入成功');
    } catch(err) {
      toast('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetData() {
  if (!confirm('确定恢复默认数据？当前数据将被覆盖。')) return;
  data.modelLibrary = JSON.parse(JSON.stringify(DEFAULT_MODEL_LIBRARY));
  data.parts = JSON.parse(JSON.stringify(DEFAULT_PARTS));
  data.selling = JSON.parse(JSON.stringify(DEFAULT_SELLING));
  data.ljhh = JSON.parse(JSON.stringify(DEFAULT_LJHH));
  saveData();
  populateBrand();
  renderPartsTable();
  renderSellingTable();
  onBrandChange();
  toast('已恢复默认数据');
}

// ======================== Sync from Tencent Docs ========================
async function syncFromTencent() {
  let serverUrl = localStorage.getItem('cost_calc_server_url') || '';
  if (!serverUrl) {
    serverUrl = prompt('请输入电脑服务地址（如 http://192.168.1.29:3000）', 'http://192.168.1.29:3000');
    if (!serverUrl) return;
    serverUrl = serverUrl.trim();
  }
  serverUrl = serverUrl.replace(/\/+$/, '');
  localStorage.setItem('cost_calc_server_url', serverUrl);

  const btn = document.getElementById('sync-tdoc-btn');
  btn.disabled = true;
  btn.textContent = '同步中...';

  try {
    const resp = await fetch(serverUrl + '/api/kb/sync-all-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: AbortSignal.timeout ? AbortSignal.timeout(60000) : undefined,
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const result = await resp.json();
    if (!result.ok) throw new Error(result.error || '同步失败');

    // Merge synced data into local storage
    if (result.parts && Array.isArray(result.parts)) {
      data.parts = result.parts.map(p => ({
        id: p.id || genId('part'),
        brand: p.brand || '',
        model: p.model || '',
        partType: p.partType || '',
        remark: p.remark || '',
        price: toNumber(p.price),
      }));
    }
    if (result.selling && Array.isArray(result.selling)) {
      data.selling = result.selling.map(s => ({
        id: s.id || genId('sell'),
        brand: s.brand || '',
        model: s.model || '',
        ram: s.ram || '',
        storage: s.storage || '',
        conditionGrade: s.conditionGrade || 'good',
        source: s.source || 'default',
        price: toNumber(s.price),
        settlementPrice: toNumber(s.settlementPrice),
      }));
    }
    if (result.modelLibrary && typeof result.modelLibrary === 'object') {
      data.modelLibrary = result.modelLibrary;
    }
    if (result.ljhh && Array.isArray(result.ljhh)) {
      data.ljhh = result.ljhh.map(x => ({
        id: x.id || genId('ljhh'),
        date: x.date || '',
        brand: x.brand || '',
        model: x.model || '',
        ram: x.ram || '',
        storage: x.storage || '',
        conditionGrade: x.conditionGrade || 'good',
        conditionLabel: x.conditionLabel || '',
        price: toNumber(x.price),
      }));
    }
    saveData();

    // Refresh UI
    populateBrand();
    const brandSel = document.getElementById('cc-brand');
    if ([...brandSel.options].some(o => o.value === 'Huawei')) {
      brandSel.value = 'Huawei';
    }
    if (brandSel.value) onBrandChange();
    renderPartsTable();
    renderSellingTable();

    toast(`同步成功: ${result.stats.parts}条配件, ${result.stats.selling}条售价, ${result.stats.ljhh || 0}条靓机汇, ${result.stats.models}个型号`);
  } catch (err) {
    const msg = err.name === 'TimeoutError' || err.name === 'AbortError'
      ? '连接超时(60秒)，请确认服务器已启动'
      : '同步失败: ' + err.message + ' (请确认服务器已启动)';
    toast(msg);
  } finally {
    btn.disabled = false;
    btn.textContent = '⟳ 同步数据';
  }
}

init();
